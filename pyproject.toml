[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-control-center"
version = "0.1.0"
description = "Deterministic local foundation for an AI operations control center."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.14,<3.0",
    "pydantic>=2.0,<3.0",
    "streamlit>=1.60,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
